name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment baseline
        shell: pwsh
        run: ./scripts/verify-deployment-baseline.ps1
      - name: Validate daily Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Validate parity Compose overlay
        run: docker compose --env-file .env.example -f compose.yaml -f compose.parity.yaml config --quiet

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - run: chmod +x gradlew
      - run: ./gradlew check :marketplace-service:bootJar --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
