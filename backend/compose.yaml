services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-enterprise
    ports:
      - "1521:1521"
      - "5500:5500"
    env_file:
      - .env.local

  rabbitmq:
    image: 'rabbitmq:latest'
    env_file:
      - .env.local
    ports:
      - '5672'
