spring.application.name=marketplace-core
# database source
spring.datasource.url=jdbc:oracle:thin:@//oracle-enterprise:1521/FREEPDB1
spring.datasource.username=SYSTEM
spring.datasource.password=admin123
# flyaway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# logging
# Application diagnostics are useful during development.
logging.level.com.example.marketplace=DEBUG

# Keep framework output readable.
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.level.org.flywaydb=INFO

# Do not print parameter bindings because they may contain sensitive values.
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Timestamp, level, application, thread, flow ID, logger, message,
# structured key-values, then exception.
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%-5level) %clr([${spring.application.name}]){cyan} %clr([%thread]){faint} %clr([flow=%X{flow_id:-none}]){magenta} %clr(%logger{40}){blue} - %msg %kvp{DOUBLE}%n%wEx