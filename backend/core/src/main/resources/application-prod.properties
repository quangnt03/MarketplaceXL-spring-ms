spring.application.name=marketplace-core
# database source
spring.datasource.url=jdbc:oracle:thin:@//oracle-enterprise:1521/FREEPDB1
spring.datasource.username=SYSTEM
spring.datasource.password=admin123
# flyaway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# logging
# Application diagnostics are useful during development.
logging.level.root=INFO
logging.level.com.example.marketplace=INFO

# Avoid verbose or sensitive framework diagnostics.
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Emit one ECS JSON object per console line.
logging.structured.format.console=ecs

# Service identity.
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=${APP_VERSION:unknown}
logging.structured.ecs.service.environment=${DEPLOYMENT_ENV:production}
logging.structured.ecs.service.node-name=${HOSTNAME:unknown}

# Preserve the useful part of large exceptions while bounding log volume.
logging.structured.json.stacktrace.root=first
logging.structured.json.stacktrace.max-length=32768
logging.structured.json.stacktrace.max-throwable-depth=40
logging.structured.json.stacktrace.include-common-frames=false
logging.structured.json.stacktrace.include-hashes=true