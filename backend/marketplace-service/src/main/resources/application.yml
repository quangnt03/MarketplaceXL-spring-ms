spring:
  application:
    name: marketplace-service

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

  mvc:
    log-request-details: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: "${spring.application.name}"
    version: "${APP_VERSION:development}"

logging:
  level:
    root: INFO
    "com.example.marketplace": INFO
    "org.springframework.security": INFO
    "org.hibernate.orm.jdbc.bind": "OFF"
