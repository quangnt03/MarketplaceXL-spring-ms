services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-enterprise
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:?Set ORACLE_PWD in the selected env file}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in the selected env file}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in the selected env file}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./infra/oracle/init:/opt/oracle/scripts/startup:ro
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  localstack:
    image: localstack/localstack:4
    environment:
      AWS_DEFAULT_REGION: ${LOCALSTACK_REGION:-us-east-1}
      SERVICES: cognito-idp,s3,sns
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      DEBUG: ${DEBUG:-0}
    volumes:
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:4566/_localstack/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: marketplace-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      DATABASE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DATABASE_USERNAME: ${DATABASE_USERNAME:-marketplace_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${LOCALSTACK_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      oracle:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  frontend:
    build:
      context: ./frontend/web
    environment:
      BACKEND_BASE_URL: http://backend:8080
      NEXTAUTH_URL: http://localhost:${FRONTEND_PORT:-3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  oracle-data:
  localstack-data:
